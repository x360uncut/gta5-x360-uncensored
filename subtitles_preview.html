const RU_CURSE_RE = /(блядь|бля|блядина|нахуй|похуй|дохуя|нихуя|с хуя|какого хуя|хуй|хуйня|хуевый|хуесос|ебаный|ебать|ебаная|ебаное|ебаные|ебанутый|заебал|заебали|уебок|уебки|уебков|долбоеб|долбоебы|пидорас|пидорасы|пиздец|отпиздить|охуеть|охуенно|гондон|гондоны|отсоси|сука)/gi;
const CENSOR_1C_RE = /(черт|чертова|чертово|чертовы|чертовой|блин|хрен|хрена|хренов|хренова|хреновые|хрень|ублюдок|ублюдки|ублюдков|засранец|засранцы|придурок|придурки|подонок|подонки|твою мать|мать твою|пошел к черту|ни черта|до черта)/gi;

function cleanTags(str) {
  if (!str) return '';
  return str.replace(/~[a-z0-9_]+~/gi, '');
}

function highlightEn(str) {
  const clean = cleanTags(str);
  return clean.replace(EN_CURSE_RE, '<span class="pill-en">$1</span>');
}

function highlight1C(str) {
  const clean = cleanTags(str);
  return clean.replace(CENSOR_1C_RE, '<span class="pill-censored">$1</span>');
}

function highlightMod(str) {
  const clean = cleanTags(str);
  return clean.replace(RU_CURSE_RE, '<span class="pill-curse">$1</span>');
}

function filterData() {
  const s = currentSearch.toLowerCase().trim();
  filteredItems = RAW_DATA.filter(item => {
    if (currentFilter !== 'all' && item.cat !== currentFilter) return false;
    if (!s) return true;
    return item.en.toLowerCase().includes(s) ||
           item.orig_1c.toLowerCase().includes(s) ||
           item.mod.toLowerCase().includes(s) ||
           item.mission.toLowerCase().includes(s) ||
           item.file.toLowerCase().includes(s) ||
           item.hash.toLowerCase().includes(s);
  });
  
  renderedCount = 0;
  document.getElementById('cardsContainer').innerHTML = '';
  renderBatch();
}

function renderBatch() {
  const container = document.getElementById('cardsContainer');
  const nextSlice = filteredItems.slice(renderedCount, renderedCount + PAGE_SIZE);
  
  nextSlice.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="mission-title">${item.mission}</div>
        <div class="meta-tags">
          <span class="file-tag">${item.file}</span>
          <span class="hash-tag">${item.hash}</span>
        </div>
      </div>
      <div class="card-grid">
        <div class="col-box">
          <div class="col-header header-en">🇺🇸 Rockstar Games (Оригинал)</div>
          <div class="col-text">${highlightEn(item.en) || '<span style="color:var(--text-muted)">[Реплика отсутствует в американской базе]</span>'}</div>
        </div>
        <div class="col-box">
          <div class="col-header header-1c">🛑 Локализация 1С (Цензура)</div>
          <div class="col-text">${highlight1C(item.orig_1c)}</div>
        </div>
        <div class="col-box mod-box">
          <div class="col-header header-mod">🔥 Наш перевод (Без цензуры)</div>
          <div class="col-text">${highlightMod(item.mod)}</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
  
  renderedCount += nextSlice.length;
  document.getElementById('resultsCount').innerText = `Показано: ${renderedCount} из ${filteredItems.length}`;
  
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if (renderedCount < filteredItems.length) {
    loadMoreBtn.style.display = 'block';
  } else {
    loadMoreBtn.style.display = 'none';
  }
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  filterData();
});

document.getElementById('tabsContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.cat;
  filterData();
});

document.getElementById('loadMoreBtn').addEventListener('click', () => {
  renderBatch();
});

// Keyboard shortcut '/' to search
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Initial render
filterData();
</script>
</body>
</html>
